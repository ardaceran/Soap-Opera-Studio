# Publishes the app as a website on GitHub Pages: https://<owner>.github.io/<repo>/
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
# Then: Actions tab -> "Deploy web app" -> Run workflow (run again after code changes).
# The web app talks to the Supabase project in lib/config.dart, or to the one given
# in the run's inputs (e.g. a separate demo project).
name: Deploy web app

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Supabase project URL for this build (empty = the one in lib/config.dart)"
        default: ""
      supabase_key:
        description: "Its publishable key (sb_publishable_..., not the secret key)"
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy project files that live outside lib/
        run: cp -R needed_files/. .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for the web (served from /<repo>/)
        env:
          SB_URL: ${{ inputs.supabase_url }}
          SB_KEY: ${{ inputs.supabase_key }}
        run: |
          defs=""
          # A secret key must never reach the browser: stop the build if one was pasted.
          case "$SB_KEY" in
            sb_secret_*|*service_role*)
              echo "::error::That is a SECRET key. Use the publishable key (sb_publishable_...). Rotate the secret key in Supabase now."
              exit 1;;
          esac
          if [ -n "$SB_KEY" ]; then
            role=$(echo "$SB_KEY" | cut -d. -f2 | base64 -d 2>/dev/null | grep -o '"role":"[a-z_]*"' || true)
            if [ "$role" = '"role":"service_role"' ]; then
              echo "::error::That is the service_role key. Use the publishable / anon key."; exit 1
            fi
          fi
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            defs="--dart-define=SUPABASE_URL=$SB_URL --dart-define=SUPABASE_KEY=$SB_KEY"
            echo "Building against $SB_URL"
          fi
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" $defs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
