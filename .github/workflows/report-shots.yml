# Screenshots for the weekly progress report (started by hand):
# - the published web app (login, home, a series page)
# - frames from an episode video
# The pictures are printed into the log as base64 so they can be copied into the report.
name: Report screenshots

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Published web app"
        default: "https://mertkaraca04.github.io/Soap-Opera-Studio/"
      video_url:
        description: "Public URL of an episode MP4 (optional)"
        default: ""

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and FFmpeg
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: App screenshots
        continue-on-error: true
        run: python tools/report_shots.py "${{ inputs.app_url }}" shots
      - name: Video frames
        if: inputs.video_url != ''
        continue-on-error: true
        run: |
          mkdir -p shots
          curl -sSfL "${{ inputs.video_url }}" -o ep.mp4
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 ep.mp4)
          echo "video length: $d s"
          i=0
          for f in 0.08 0.3 0.5 0.7 0.9; do
            i=$((i+1)); t=$(python -c "print($d*$f)")
            ffmpeg -loglevel error -y -ss "$t" -i ep.mp4 -frames:v 1 -vf scale=360:-2 "shots/frame_$i.jpg"
          done
      - name: Print pictures as base64
        run: |
          cd shots 2>/dev/null || exit 0
          for f in *; do
            if [[ $f == *.png ]]; then ffmpeg -loglevel error -y -i "$f" -vf scale=390:-2 -q:v 4 "${f%.png}.jpg" && f="${f%.png}.jpg"; fi
            echo "=====BEGIN $f"; base64 -w 0 "$f"; echo; echo "=====END $f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: report-shots
          path: shots
          if-no-files-found: ignore
